name: Bug report
description: Something doesn't work as described in the README
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a prompt in Codex app
        2. Close the lid
        3. ...
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: awake status
      description: Output of `awake status` and `awake version`, taken while the problem happens if you can.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from `~/.agent-awake/awake.log`.
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.5
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      multiple: true
      options:
        - Claude Code CLI
        - Claude desktop app (Code tab)
        - Codex CLI
        - Codex / ChatGPT desktop app
        - Other
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent version
      placeholder: "codex-cli 0.160.0, Claude Code 2.x"
