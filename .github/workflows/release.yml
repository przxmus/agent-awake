name: Release

# Two stages, because main only accepts changes through a pull request:
#  1. Run manually: opens a "chore: release vX.Y.Z" PR bumping VERSION and CHANGELOG.
#  2. Merge that PR: the push to main tags it and publishes the GitHub release.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major, custom]
      custom_version:
        description: Version for "custom" (X.Y.Z, without the v)
        type: string
        required: false
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (got $GITHUB_REF)"
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM: ${{ inputs.custom_version }}
        run: |
          prev_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          base=${prev_tag#v}
          base=${base:-$(tr -d '[:space:]' < VERSION)}

          if [ "$BUMP" = custom ]; then
            next=${CUSTOM#v}
          else
            IFS=. read -r major minor patch <<< "$base"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi

          if ! [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$next' is not a valid X.Y.Z version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::Tag v$next already exists"
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/v$next" >/dev/null 2>&1; then
            echo "::error::Branch release/v$next already exists, close its PR and delete it first"
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Update VERSION and CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$VERSION" > VERSION
          awk -v v="$VERSION" '
            /^## Unreleased/ && !done { print; print ""; print "## " v; print ""; done=1; skip=1; next }
            skip && /^$/ { skip=0; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add VERSION CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: release v$VERSION" \
            --body "Bumps \`VERSION\` and \`CHANGELOG.md\` to $VERSION. Merging this PR tags \`v$VERSION\` and publishes the GitHub release with notes generated from the commits since the previous tag."
          # PRs opened with GITHUB_TOKEN do not trigger CI, so run the required check by hand.
          gh workflow run ci.yml --ref "$branch"

  publish:
    if: "github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          prev_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          range=${PREV_TAG:+$PREV_TAG..}HEAD
          git log "$range" --no-merges --format='%h%x09%s' |
            awk -F'\t' '$2 !~ /^chore: release v/' > commits.tsv

          section() { # title, extended regex matched against the subject
            local out
            out=$(awk -F'\t' -v re="$2" '$2 ~ re' commits.tsv |
              while IFS=$'\t' read -r sha subject; do
                printf -- '- %s (%s)\n' "$subject" "$sha"
              done)
            if [ -n "$out" ]; then
              printf '### %s\n\n%s\n\n' "$1" "$out"
            fi
          }

          {
            section "Breaking changes" '^[a-z]+(\([^)]*\))?!:'
            section "Features" '^feat(\([^)]*\))?:'
            section "Fixes" '^fix(\([^)]*\))?:'
            section "Performance" '^perf(\([^)]*\))?:'
            section "Documentation" '^docs(\([^)]*\))?:'
            section "Maintenance" '^(chore|ci|build|refactor|test|style|revert)(\([^)]*\))?:'
            section "Other" '^([^:]*$|[^a-z]|[a-z]+[^a-z(!:])'
            if [ -n "$PREV_TAG" ]; then
              printf '**Full changelog**: https://github.com/%s/compare/%s...v%s\n' "$REPO" "$PREV_TAG" "$VERSION"
            fi
          } > notes.md

          if [ ! -s notes.md ]; then
            echo "No changes since ${PREV_TAG:-the beginning}." > notes.md
          fi
          cat notes.md

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
